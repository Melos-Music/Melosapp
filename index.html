<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#34c759">
<title>Melos</title>
<style>
:root {
  --g:       #34c759;
  --g2:      #2aad4a;
  --g-glow:  rgba(52,199,89,0.22);
  --g-soft:  rgba(52,199,89,0.08);
  --bg:      #0d0d0d;
  --bg2:     #111411;
  --card:    #161a16;
  --card2:   #1c211c;
  --border:  rgba(52,199,89,0.12);
  --border2: rgba(255,255,255,0.06);
  --txt:     #f0f4f0;
  --txt2:    rgba(240,244,240,0.5);
  --txt3:    rgba(240,244,240,0.25);
  --red:     #ff3b30;
  --serif:   'Georgia', 'Times New Roman', serif;
  --mono:    'Courier New', 'Menlo', monospace;
  --sans:    '-apple-system', 'BlinkMacSystemFont', 'Helvetica Neue', sans-serif;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}
/* PWA standalone mode adjustments for safe-area integration */
@media (display-mode: standalone) {
  html, body {
    background: var(--bg);
    transition: background-color 0.3s ease;
  }
  body.pwa-recording {
    background: #34c759 !important;
  }
  .app {
    padding-top: env(safe-area-inset-top, 0px);
  }
  .status-strip, .site-banner, .perm-screen::before {
    height: calc(env(safe-area-inset-top, 0px) + 4px) !important;
  }
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:var(--sans);-webkit-font-smoothing:antialiased;position:fixed;top:0;left:0;right:0;bottom:0}
/* iOSのデフォルトボタンスタイルをリセット（色は維持） */
button{-webkit-appearance:none;appearance:none;font:inherit;cursor:pointer;}
a{color:inherit;text-decoration:none;}

/* ── ALWAYS-GREEN BANNER (status bar area) ── */
.site-banner{
position:fixed;top:0;left:0;right:0;
height:calc(var(--safe-top) + 4px);
background:#34c759;
z-index:300;
pointer-events:none;
}

/* ── CAMERA SWITCH POPUP ── */
.cam-popup{
position:fixed;
bottom:calc(env(safe-area-inset-bottom,16px) + 80px);
left:50%;
transform:translateX(-50%) translateY(20px);
z-index:500;
background:rgba(15,22,15,0.92);
border:1px solid rgba(52,199,89,0.35);
border-radius:100px;
padding:10px 28px;
font-family:var(--mono);
font-size:13px;
font-weight:700;
color:var(--g);
letter-spacing:0.18em;
white-space:nowrap;
opacity:0;
transition:opacity 0.28s cubic-bezier(0.34,1.56,0.64,1), transform 0.28s cubic-bezier(0.34,1.56,0.64,1);
pointer-events:none;
backdrop-filter:blur(16px);
box-shadow:0 4px 24px rgba(52,199,89,0.18);
}
.cam-popup.show{
opacity:1;
transform:translateX(-50%) translateY(0);
}

/* ══ PERMISSION SCREEN ══ */
.perm-screen{
position:fixed;inset:0;z-index:200;
background:linear-gradient(160deg,#0a180c 0%,#0d0d0d 60%,#050d06 100%);
display:flex;flex-direction:column;align-items:center;justify-content:center;
padding:40px 28px;
padding-top:max(env(safe-area-inset-top,50px),40px);
gap:0;
}
.perm-screen::before{
content:'';
position:fixed;top:0;left:0;right:0;
height:calc(env(safe-area-inset-top,20px) + 2px);
background:#34c759;
z-index:201;
}
.perm-wordmark{font-family:var(--serif);font-size:52px;color:var(--g);letter-spacing:-0.01em;line-height:1;margin-bottom:6px}
.perm-tagline{font-family:var(--mono);font-size:10px;letter-spacing:0.3em;color:var(--txt3);text-transform:uppercase;margin-bottom:48px}
.perm-card{width:100%;max-width:320px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:24px;margin-bottom:28px}
.perm-card-title{font-size:10px;font-weight:600;color:var(--txt3);letter-spacing:0.2em;margin-bottom:16px;text-transform:uppercase;font-family:var(--mono)}
.perm-row{display:flex;align-items:flex-start;gap:14px;padding:12px 0;border-bottom:1px solid var(--border2)}
.perm-row:last-child{border-bottom:none;padding-bottom:0}
.perm-row:first-of-type{padding-top:0}
.perm-ico{width:36px;height:36px;border-radius:10px;background:var(--g-soft);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.perm-txt strong{display:block;font-size:13px;font-weight:600;color:var(--txt);margin-bottom:3px}
.perm-txt span{font-size:11px;color:var(--txt2);line-height:1.5}
/* ① Continueボタン - 文字色を確実に黒く */
.btn-perm{
width:100%;max-width:320px;height:54px;border-radius:14px;
border:none;
background:#34c759 !important;
color:#000000 !important;
font-family:var(--sans);font-size:16px;font-weight:800;
letter-spacing:0.03em;cursor:pointer;
transition:opacity .2s,transform .15s;
box-shadow:0 6px 28px rgba(52,199,89,0.35);
display:flex;align-items:center;justify-content:center;
-webkit-appearance:none;
opacity:1 !important;
}
.btn-perm:active{transform:scale(0.97);}
.perm-screen.gone{display:none!important}

/* ══ MAIN APP ══ */
.app{
position:fixed;inset:0;display:flex;flex-direction:column;
background:var(--bg);
opacity:0;pointer-events:none;transition:opacity .5s;
padding-top:env(safe-area-inset-top, 0px);
}
.app.visible{opacity:1;pointer-events:all}

/* ③ 緑バナー - safe-area-inset-topに完全に合わせる */
.status-strip{
position:fixed;top:0;left:0;right:0;
height:calc(env(safe-area-inset-top, 0px) + 4px);
min-height:0;
background:#34c759;
display:flex;align-items:flex-end;padding:0 14px 2px;gap:8px;z-index:100;
}

.strip-dot{width:5px;height:5px;border-radius:50%;background:#054d18;opacity:0.6}
.strip-dot.pulse{opacity:1;animation:blink .9s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.strip-label{font-family:var(--mono);font-size:9px;color:#054d18;letter-spacing:0.25em;opacity:0.7}

/* ── Navbar ── */
.navbar{
height:56px;
display:flex;align-items:center;justify-content:space-between;
padding:0 20px;
background:#050806;opacity:1;
position:relative;z-index:5;flex-shrink:0;
overflow:hidden;
}
.nav-wordmark{font-family:var(--serif);font-size:26px;color:var(--g);letter-spacing:-0.01em;flex-shrink:0}
.nav-right{display:flex;gap:8px;align-items:center;flex-shrink:0;}
.nav-btn{
width:36px;height:36px;border-radius:10px;
border:1px solid var(--border2);background:var(--card);color:var(--txt2);
display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;
position:relative;
}
.nav-btn:active{transform:scale(0.91)}
.nav-btn svg{width:17px;height:17px}
/* recording indicator dot on camera-switch btn */
.nav-btn .rec-badge{
position:absolute;top:-3px;right:-3px;width:8px;height:8px;
border-radius:50%;background:var(--red);
border:2px solid var(--bg2);
display:none;
}
.nav-btn .rec-badge.show{display:block;animation:blink .9s ease-in-out infinite}

/* ── Scroll body ── */
.scroll-body{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:0 18px calc(80px + env(safe-area-inset-bottom, 0px))}
.scroll-body::-webkit-scrollbar{display:none}

/* ── Album hero ── */
.album-hero{
position:relative;margin:20px 0 24px;
border-radius:24px;overflow:hidden;aspect-ratio:1;
background:var(--card);
box-shadow:0 20px 60px rgba(0,0,0,0.5),0 0 0 1px var(--border);
}
.album-art-canvas{width:100%;height:100%;display:block}
.album-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,0.6) 0%,transparent 50%)}
.album-badge{
position:absolute;bottom:14px;left:14px;
background:transparent;backdrop-filter:none;
border:none;border-radius:100px;padding:0;
font-family:var(--mono);font-size:10px;letter-spacing:0.15em;color:transparent;
display:none;align-items:center;gap:6px;transition:all .3s;
}
.album-badge.recording{
color:var(--g);
}
.album-badge-dot{display:none;}

/* ── Song info ── */
.song-info{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px}
.song-title{font-family:var(--serif);font-size:28px;line-height:1.1;color:var(--txt);letter-spacing:-0.01em;font-weight:700}
.song-title em{color:var(--txt);font-style:italic}
.song-artist{font-size:13px;color:var(--txt2);margin-top:5px;font-weight:400}
.btn-heart{
width:40px;height:40px;border-radius:50%;border:1.5px solid var(--border2);
background:rgba(52,199,89,0.05);color:var(--g);
display:flex;align-items:center;justify-content:center;
cursor:pointer;flex-shrink:0;margin-top:0;transition:all .2s;font-size:20px;
}
.btn-heart:active{transform:scale(0.85)}

/* ── Waveform ── */
.waveform-bars{display:flex;align-items:center;justify-content:center;gap:3px;height:32px;margin-bottom:14px}
.waveform-bars.paused .bar{animation-play-state:paused!important;height:4px!important}
.bar{width:3px;border-radius:2px;background:var(--g);opacity:0.7;height:4px;}
@keyframes eq1{0%,100%{height:4px}50%{height:22px}}
@keyframes eq2{0%,100%{height:10px}40%{height:26px}70%{height:8px}}
@keyframes eq3{0%,100%{height:18px}30%{height:6px}60%{height:28px}}
@keyframes eq4{0%,100%{height:8px}45%{height:20px}}
@keyframes eq5{0%,100%{height:14px}35%{height:4px}65%{height:22px}}
@keyframes eq6{0%,100%{height:6px}50%{height:18px}}
@keyframes eq7{0%,100%{height:20px}25%{height:8px}75%{height:16px}}
@keyframes eq8{0%,100%{height:12px}55%{height:24px}}
@keyframes eq9{0%,100%{height:4px}40%{height:20px}}
@keyframes eq10{0%,100%{height:16px}50%{height:4px}}
@keyframes eq11{0%,100%{height:8px}30%{height:26px}}
@keyframes eq12{0%,100%{height:22px}60%{height:6px}}

/* ── Progress ── */
.progress-wrap{margin-bottom:12px}
.progress-track{height:5px;background:var(--card2);border-radius:3px;overflow:hidden;cursor:pointer}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--g2),var(--g));border-radius:2px;width:0%;transition:width .1s linear;box-shadow:0 0 8px var(--g-glow)}
.progress-times{display:flex;justify-content:space-between;margin-top:8px;font-family:var(--mono);font-size:11px;color:var(--txt3)}

/* ── Controls ── */
.ctrl-row{display:flex;align-items:center;justify-content:space-between;margin:28px 0 28px;padding:0 8px}
.ctrl-side{display:flex;gap:12px;align-items:center}
.btn-ctrl{
width:48px;height:48px;border-radius:50%;
border:1px solid rgba(255,255,255,0.08)!important;outline:none!important;
background:rgba(255,255,255,0.02)!important;
color:var(--txt2)!important;
-webkit-appearance:none!important;
display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;
}
.btn-ctrl svg{width:20px;height:20px;stroke:currentColor;fill:none;}
.btn-ctrl:active{transform:scale(0.88);color:var(--txt)!important}
.btn-ctrl.active{color:var(--g)!important}

/* MAIN PLAY BUTTON */
.btn-play{
width:80px;height:80px;border-radius:50%;
background:radial-gradient(circle at 35% 35%,#3ddc68,#2aad4a) !important;
color:#040c05 !important;
display:flex;align-items:center;justify-content:center;
cursor:pointer;
transition:all .25s cubic-bezier(0.34,1.56,0.64,1);
box-shadow:0 12px 32px rgba(52,199,89,0.25),inset 0 1px 0 rgba(255,255,255,0.15);
position:relative;
-webkit-appearance:none;
border:none;
}
.btn-play::after{
content:’’;position:absolute;inset:-8px;border-radius:50%;
border:1.5px solid rgba(52,199,89,0.2);transition:all .3s;
}
.btn-play.recording{
background:radial-gradient(circle at 35% 35%,#5ddd7a,var(--g2));
box-shadow:0 0 0 8px rgba(52,199,89,0.15),0 8px 24px rgba(0,0,0,0.35);
}
.btn-play.recording::after{border-color:rgba(52,199,89,0.4);animation:ring-pulse 1.6s ease-in-out infinite}
@keyframes ring-pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.2);opacity:0.3}}
.btn-play:active{transform:scale(0.93)}

/* ── Volume ── */
.volume-row{display:none}
.vol-ico{display:none}
.vol-ico svg{display:none}
.vol-track{display:none}
.vol-fill{display:none}

/* ── Queue ── */
.section-label{font-family:var(--mono);font-size:10px;letter-spacing:0.2em;color:var(--txt3);text-transform:uppercase;margin-bottom:14px;margin-top:2px}
.queue-list{display:flex;flex-direction:column;gap:2px}
.queue-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;cursor:default;transition:background .2s}
.queue-thumb{width:40px;height:40px;border-radius:8px;flex-shrink:0;overflow:hidden}
.queue-thumb canvas{width:100%;height:100%;display:block}
.queue-info{flex:1;min-width:0}
.queue-name{font-size:13px;font-weight:600;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.queue-artist{font-size:11px;color:var(--txt2);margin-top:2px}
.queue-dur{font-family:var(--mono);font-size:11px;color:var(--txt3);flex-shrink:0}

/* ② ボトムナビ - ホームインジケーターと被らないよう修正 */
.bottom-nav{
position:fixed;bottom:0;left:0;right:0;
border-top:1px solid rgba(255,255,255,0.05);
display:flex;align-items:center;
padding-top:12px;
padding-bottom:max(12px, env(safe-area-inset-bottom, 0px));
justify-content:space-around;z-index:10;
background:linear-gradient(to top, rgba(10,10,10,1), rgba(10,10,10,0.95));backdrop-filter:blur(24px);
height:auto;min-height:64px;
}

.bnav-item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 20px;cursor:pointer;transition:all .2s;color:var(--txt3)}
.bnav-item.active{color:var(--g)}
.bnav-item:active{transform:scale(0.92)}
.bnav-item svg{width:22px;height:22px}
.bnav-label{font-size:10px;font-weight:700;letter-spacing:0.05em}

/* iPhone PWA: ホームインジケータを避けつつ、メニュー項目を必要以上に持ち上げない */
@media (display-mode: standalone) {
  .bottom-nav{
    bottom:0;
    min-height:0;
    padding-top:6px;
    padding-bottom:env(safe-area-inset-bottom, 0px) !important;
  }
  .bnav-item{padding-top:4px;padding-bottom:4px;}
  .scroll-body{padding-bottom:calc(58px + env(safe-area-inset-bottom, 0px)) !important;}
}

/* ══ CLOCK PANEL ══ */
.clock-panel{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 28%,rgba(52,199,89,.12),transparent 42%),rgba(5,8,6,.98);transform:translateX(100%);transition:transform .38s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column}
.clock-panel.open{transform:translateX(0)}
.clock-brand,.tattoo-wordmark{font-family:Impact,Haettenschweiler,'Arial Black',sans-serif;font-size:26px;letter-spacing:.12em;color:#fff;text-shadow:2px 2px 0 rgba(52,199,89,.5),-1px -1px 0 rgba(255,255,255,.2);cursor:pointer;user-select:none}
.clock-header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border2)}
.clock-body{flex:1;overflow-y:auto;padding:28px 20px calc(90px + env(safe-area-inset-bottom,0px));text-align:center}
.clock-face{font-family:var(--mono);font-size:48px;letter-spacing:.08em;color:var(--txt);margin:28px 0 8px;text-shadow:0 0 28px rgba(52,199,89,.35);cursor:pointer;transition:color .2s,text-shadow .2s}.clock-face.recording{color:var(--g);text-shadow:0 0 30px rgba(52,199,89,.8)}
.clock-date{font-size:13px;color:var(--txt2);letter-spacing:.08em;margin-bottom:32px}
.clock-tabs{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;gap:8px;margin:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));max-width:none;background:rgba(5,8,6,.96);border-top:1px solid var(--border2);backdrop-filter:blur(20px)}
.clock-tab{flex:1;padding:11px 8px;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--txt2);font-size:12px;font-weight:700;cursor:pointer}
.clock-tab.active{background:rgba(52,199,89,.16);border-color:rgba(52,199,89,.65);color:var(--g)}
.clock-mode{display:none;max-width:420px;margin:0 auto}.clock-mode.active{display:block}
.clock-value{font-family:var(--mono);font-size:42px;letter-spacing:.1em;color:var(--g);margin:25px 0}
.clock-actions{display:flex;justify-content:center;gap:10px}.clock-action{min-width:110px;padding:12px 18px;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--txt);font-weight:700;cursor:pointer}.clock-action.primary{background:var(--g);border-color:var(--g);color:#081009}
.timer-inputs{display:flex;justify-content:center;gap:8px;margin:24px 0}.timer-inputs input{width:82px;padding:12px 8px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--txt);font-family:var(--mono);font-size:20px;text-align:center}.timer-inputs label{display:flex;flex-direction:column;gap:5px;font-size:10px;color:var(--txt3);letter-spacing:.08em}

/* Apple-style clock overrides */
.clock-panel{background:#f2f2f7;color:#1c1c1e;backdrop-filter:none;opacity:1}
.clock-header{background:#fff;border-bottom:1px solid #d1d1d6;padding:16px 20px}
.clock-brand,.tattoo-wordmark{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;font-size:23px;font-weight:800;letter-spacing:.08em;color:#1c1c1e;text-shadow:none}
.clock-header .btn-back{background:#f2f2f7;color:#007aff;border:1px solid #d1d1d6}
.clock-body{background:#f2f2f7;color:#1c1c1e;padding:32px 20px 112px}
.clock-face{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;font-size:58px;font-weight:300;letter-spacing:-.04em;color:#1c1c1e;text-shadow:none;margin:36px 0 6px}
.clock-face.recording{color:#34c759;text-shadow:none}
.clock-date{color:#8e8e93;font-size:15px;margin-bottom:28px}
.clock-tabs{background:rgba(255,255,255,.98);border-top:1px solid #d1d1d6;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));backdrop-filter:none}
.clock-tab{border:0;border-radius:9px;background:#e5e5ea;color:#3a3a3c;font-size:13px;font-weight:600;padding:12px 8px}
.clock-tab.active{background:#007aff;border-color:#007aff;color:#fff}
.clock-mode{color:#3a3a3c}.clock-mode>div:first-child{color:#8e8e93!important}
.clock-value{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;font-size:54px;font-weight:300;letter-spacing:-.04em;color:#1c1c1e;margin:28px 0}
.clock-actions{gap:12px}.clock-action{min-width:120px;padding:13px 20px;border:0;border-radius:12px;background:#e5e5ea;color:#1c1c1e;font-size:15px;font-weight:600}.clock-action.primary{background:#007aff;border-color:#007aff;color:#fff}
.timer-fixed{margin:24px auto 4px;color:#8e8e93;font-size:15px}.timer-fixed strong{display:block;margin-top:6px;color:#1c1c1e;font-size:17px;font-weight:600}

/* ══ LIBRARY PANEL ══ */
.library-panel{
position:fixed;inset:0;z-index:50;
background:rgba(5,8,6,0.96);
backdrop-filter:blur(28px) saturate(0.2) brightness(0.6);
transform:translateX(100%);transition:transform .38s cubic-bezier(0.32,0.72,0,1);
display:flex;flex-direction:column;
padding-top:max(env(safe-area-inset-top),20px);
}
.library-panel.open{transform:translateX(0)}

/* ══ SEARCH PANEL ══ */
.search-panel{
position:fixed;inset:0;z-index:50;
background:rgba(5,8,6,0.96);
backdrop-filter:blur(28px) saturate(0.2) brightness(0.6);
transform:translateY(100%);transition:transform .38s cubic-bezier(0.32,0.72,0,1);
display:flex;flex-direction:column;
padding-top:max(env(safe-area-inset-top),20px);
}
.search-panel.open{transform:translateY(0)}
.search-header{display:flex;align-items:center;padding:12px 20px 16px;gap:12px;border-bottom:1px solid var(--border2)}
.search-input-wrap{
flex:1;display:flex;align-items:center;gap:10px;
background:var(--card2);border-radius:12px;padding:10px 14px;
border:1px solid var(--border2);
}
